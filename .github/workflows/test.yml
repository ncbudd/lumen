# Builds Lumen and runs its type check, unit tests and browser tests (desktop, iPhone,
# Android and tablet) for every pull request that touches lumen/, and after each sync.
name: Lumen tests

on:
  pull_request:
    paths:
      - 'lumen/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'lumen/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lumen/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: lumen/test-results
          retention-days: 7
